services:
  jenkins:
    build: .
    container_name: jenkins-k8s-lab
    ports:
      - "8080:8080"
    environment:
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-admin123!}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KUBE_CONFIG_PATH}:/var/jenkins_home/.kube/config:ro
    restart: unless-stopped

volumes:
  jenkins_home:
